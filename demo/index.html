  --ok:#2a7248; --oksoft:#e3f1e8; --warn:#8c5714; --warnsoft:#fbefdc; --bad:#a63b2b; --badsoft:#f8e3df;
  --chair:#b0843f; --chairsoft:#f3e6d1; --wash:#3d6c8c; --washsoft:#e1ecf3; --groom:#4a6a3b; --groomsoft:#e6efe0;
  --r:12px; --shadow:0 1px 2px rgba(20,18,16,.06),0 4px 14px rgba(20,18,16,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px} .b{font-weight:600} .right{text-align:right} .center{text-align:center}
.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .spacer{flex:1}
.grid{display:grid;gap:14px} .grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#f1ebe1;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #000}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap}
.brand .mark{width:34px;height:34px;border:1.5px solid var(--gold2);border-radius:8px;display:grid;place-items:center;color:var(--gold2)}
.brand .nm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.14em;font-size:18px;line-height:1}
.brand .sub{font-size:10px;letter-spacing:.28em;color:var(--gold2);margin-top:3px}
.demo-mini{display:none;border:1px solid #5a4a33;color:#e8c98f;background:#2a2219;border-radius:999px;padding:3px 8px;font-size:10px;letter-spacing:.12em}
.demo-pill{border:1px solid #5a4a33;color:#e8c98f;background:#2a2219;border-radius:999px;padding:4px 10px;font-size:11px;white-space:nowrap}
.top .clock{display:flex;align-items:center;gap:6px;background:#221f1c;border:1px solid #3a342d;border-radius:10px;padding:4px 6px 4px 10px;white-space:nowrap}
.top .clock b{font-variant-numeric:tabular-nums;font-size:15px;color:#fff}
.top .clock button{background:#3a342d;border:0;color:#f1ebe1;border-radius:7px;padding:3px 7px;font-size:12px}
.top select{background:#221f1c;color:#f1ebe1;border:1px solid #3a342d;border-radius:10px;padding:7px 10px}
.top .langpick{display:flex;align-items:center;gap:5px;color:#bfb3a3}
.site-hero .langpick{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;color:#cbbfae}
.site-hero .langpick select,.ph-top .langpick select{background:#221f1c;color:#f1ebe1;border:1px solid #5a4a33;border-radius:9px;padding:5px 8px;font-size:12.5px}
.ph-top .langpick{display:flex;align-items:center;gap:5px;color:#bfb3a3;margin-left:auto}
@media (max-width:480px){ .ph-top .langpick svg{display:none} }
.top .tbtn{background:transparent;border:1px solid #3a342d;color:#f1ebe1;border-radius:10px;padding:7px 11px;white-space:nowrap}
.top .tbtn .sm{display:none}
.top .tbtn.gold{background:var(--gold);border-color:var(--gold);color:#1b1309;font-weight:600}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 57px)}
.side{background:var(--ink2);color:#d9d1c4;padding:14px 10px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side .who{padding:8px 10px 14px;border-bottom:1px solid #3a3632;margin-bottom:10px}
.side .who .r{font-size:11px;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase}
.side .who .n{font-weight:600;color:#fff;margin-top:2px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#d9d1c4;text-decoration:none;margin:2px 0;cursor:pointer}
.nav button{width:100%;border:0;background:none;font:inherit;text-align:left}
.nav button:focus-visible,.st button.who:focus-visible,[data-a][tabindex]:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.nav a:hover,.nav button:hover{background:#312d29}
.nav a.on,.nav button.on{background:#3b342b;color:#fff;box-shadow:inset 3px 0 0 var(--gold2)}
.nav .ic{width:18px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:var(--gold);color:#1b1309;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side .sect{font-size:10px;letter-spacing:.2em;color:#a99f92;margin:14px 10px 4px;text-transform:uppercase}
.main{padding:22px 26px 60px;min-width:0}
.h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:700;margin:0 0 2px;letter-spacing:.01em}
.h2{font-size:16px;font-weight:700;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 18px}

/* ---------- cards, tiles, tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card .ch .t{font-weight:700}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.tile .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid #f0eae0;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tablewrap{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#f1ece4;color:var(--ink3)}
.chip.ok{background:var(--oksoft);color:var(--ok)} .chip.warn{background:var(--warnsoft);color:var(--warn)} .chip.bad{background:var(--badsoft);color:var(--bad)}
.chip.gold{background:var(--goldsoft);color:#7c5a22} .chip.dark{background:var(--ink);color:#f1ebe1}
.chip.chair{background:var(--chairsoft);color:#7c5a22} .chip.wash{background:var(--washsoft);color:var(--wash)} .chip.groom{background:var(--groomsoft);color:var(--groom)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1309}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink3)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#e7c3bc}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{background:var(--goldsoft);border:1px solid #e8d3ae;color:#5e4419;border-radius:10px;padding:10px 12px;font-size:12.5px}
.note.blue{background:var(--washsoft);border-color:#c8dbe8;color:#24465c}
.note.green{background:var(--oksoft);border-color:#c5e2d0;color:#1f5537}
.note.red{background:var(--badsoft);border-color:#eccac3;color:#7a2a1e}
.sep{height:1px;background:var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fff}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid #e6cf9f;border-color:var(--gold)}
label.lb{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
.seg{display:inline-flex;background:#efe8dc;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-weight:600;color:var(--ink3)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .opt{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 11px;text-align:left}
.pick .opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pick .opt .p{font-size:12px;opacity:.75}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px}
.slots button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 0;font-weight:600;font-variant-numeric:tabular-nums}
.slots button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* ---------- floor ---------- */
.floor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.zone{margin-bottom:14px}
.zone .zh{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:700}
.stations{display:grid;gap:10px}
.stations.c5{grid-template-columns:repeat(5,minmax(0,1fr))} .stations.c3{grid-template-columns:repeat(3,minmax(0,1fr))} .stations.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;min-height:132px;display:flex;flex-direction:column;gap:5px;position:relative;box-shadow:var(--shadow)}
.st .sn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:3px}
.st.busy.chair{border-top:4px solid var(--chair)} .st.busy.wash{border-top:4px solid var(--wash)} .st.busy.groom{border-top:4px solid var(--groom)}
.st.free{background:#fbf9f5;border-style:dashed}
.st .who{font-weight:700;font-size:14px}
.st button.who{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;font-weight:700;font-size:14px;cursor:pointer;align-self:flex-start}
.st .what{font-size:12px;color:var(--ink3)}
.st .bar{height:5px;background:#efe8dc;border-radius:4px;overflow:hidden;margin-top:auto}
.st .bar i{display:block;height:100%;background:var(--gold)}
.st .acts{display:flex;gap:6px;flex-wrap:wrap}
.st .acts .btn{white-space:normal;text-align:left;max-width:100%}
.qitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0eae0;align-items:flex-start}
.qitem:last-child{border-bottom:0}
.qnum{min-width:46px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.qnum.bk{background:var(--goldsoft);color:#7c5a22}

/* ---------- calendar ---------- */
.cal{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.cal .inner{position:relative}
.cal .hdr{display:flex;position:sticky;top:0;background:#faf7f2;border-bottom:1px solid var(--line);z-index:2}
.cal .hdr .lbl{width:120px;flex:0 0 120px;position:sticky;left:0;background:#faf7f2;z-index:3}
.cal .hdr .hr{font-size:11px;color:var(--muted);border-left:1px solid #eee6da;padding:6px 4px}
.cal .lane{display:flex;border-bottom:1px solid #f1ebe2;height:46px;position:relative}
.cal .lane .lbl{width:120px;flex:0 0 120px;position:sticky;left:0;background:#fff;z-index:2;padding:6px 10px;border-right:1px solid var(--line);font-size:12px}
.cal .lane .lbl b{display:block;font-size:12.5px}
.cal .track{position:relative;flex:0 0 auto;height:100%}
.cal .gridline{position:absolute;top:0;bottom:0;border-left:1px solid #f3eee6}
.blk{position:absolute;top:6px;bottom:6px;border-radius:7px;padding:3px 6px;font-size:11px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(0,0,0,.06)}
.blk.chair{background:var(--chairsoft);color:#5d4317;border-left:3px solid var(--chair)}
.blk.wash{background:var(--washsoft);color:#24465c;border-left:3px solid var(--wash)}
.blk.groom{background:var(--groomsoft);color:#36502a;border-left:3px solid var(--groom)}
.blk.proc{background:repeating-linear-gradient(45deg,#f3e6d1,#f3e6d1 5px,#fbf5ea 5px,#fbf5ea 10px)}
.blk.paid{opacity:.85} .blk.brk{background:#f2f0ec;color:#6b6359;border-left:3px solid #cfc7bb;cursor:default}
.blk.off{background:repeating-linear-gradient(135deg,#f6f4f0,#f6f4f0 6px,#efece6 6px,#efece6 12px);border:0;cursor:default}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1}
.nowline::before{content:'';position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,13,11,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal.wide{max-width:860px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh .t{font-weight:700;font-size:16px}
.modal .mb{padding:16px 18px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#fbf9f5;flex-wrap:wrap}
.x{border:0;background:#f1ece4;border-radius:8px;width:30px;height:30px;font-size:16px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:500;max-width:92vw}

/* ---------- receipt ---------- */
.rcpt{max-width:360px;margin:0 auto;border:1px dashed var(--line2);border-radius:10px;padding:16px;font-size:13px;background:#fffdf9}
.rcpt .hd{text-align:center;margin-bottom:10px}
.rcpt .hd .nm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.12em}
.rcpt .ln{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.rcpt .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700}

/* ---------- client side (website and portal) ---------- */
.client{background:#f4efe7;min-height:calc(100vh - 57px)}
.site-hero{background:linear-gradient(180deg,#141210,#211c17);color:#f4ece0;padding:46px 22px 40px;text-align:center;position:relative;overflow:hidden}
.site-hero .w{font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;letter-spacing:.16em;font-weight:700;line-height:1}
.site-hero .w2{font-size:12px;letter-spacing:.5em;color:var(--gold2);margin-top:8px}
.site-hero .razor{margin:16px auto 0;width:180px;height:24px;color:var(--gold2)}
.site-hero p{color:#cbbfae;max-width:520px;margin:14px auto 22px}
.site-wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.menu-cat{margin-bottom:18px}
.menu-cat h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;margin:0 0 6px;letter-spacing:.06em}
.menu-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted #d8ccb8;align-items:baseline}
.menu-item .n{font-weight:600}
.menu-item .d{font-size:12px;color:var(--muted)}
.menu-item .p{margin-left:auto;font-weight:700;white-space:nowrap}
.barbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.barber{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-weight:700;margin:0 auto 8px;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:#ece5d9;color:var(--muted);font-weight:600}
.steps span.on{background:var(--ink);color:#fff}
.steps span.done{background:var(--goldsoft);color:#7c5a22}
.phone{max-width:420px;margin:0 auto;background:#fff;border-radius:26px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(30,20,10,.15);overflow:hidden;min-height:640px}
.phone .ph-top{background:var(--ink);color:#f1ebe1;padding:18px 18px 16px}
.phone .ph-top .nm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.14em;font-size:18px}
.phone .ph-body{padding:16px}
.tabs{display:flex;border-top:1px solid var(--line);background:#faf7f2}
.tabs button{flex:1;border:0;background:transparent;padding:11px 0;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--gold)}
.vcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fffdf9}
.codebox{letter-spacing:.5em;font-size:22px;text-align:center;font-weight:700}

/* ---------- queue screen (TV) ---------- */
.tv{position:fixed;inset:0;background:#0f0e0c;color:#f4ece0;z-index:70;display:flex;flex-direction:column;padding:28px 36px}
.tv .tvh{display:flex;align-items:center;gap:16px}
.tv .btn{color:var(--ink)}
.tv .tvh .w{font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;letter-spacing:.16em;font-weight:700}
.tv .clk{margin-left:auto;font-size:34px;font-variant-numeric:tabular-nums;color:var(--gold2)}
.tv .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;margin-top:24px;flex:1;min-height:0}
.tv .chairs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tv .tch{background:#1c1a17;border:1px solid #2f2a24;border-radius:14px;padding:14px;text-align:center}
.tv .tch .n{font-size:13px;letter-spacing:.14em;color:#a8998a;text-transform:uppercase}
.tv .tch .b{font-size:18px;font-weight:700;margin-top:6px}
.tv .tch .c{font-size:28px;font-weight:700;color:var(--gold2);margin-top:6px}
.tv .tch .s{font-size:12px;color:#a8998a;margin-top:4px}
.tv .next .it{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #2a2621;font-size:20px}
.tv .next .it .tk{background:var(--gold);color:#1b1309;font-weight:800;border-radius:10px;padding:6px 12px;min-width:84px;text-align:center}
.tv .foot{display:flex;align-items:center;gap:18px;border-top:1px solid #2a2621;padding-top:16px;margin-top:16px}
.qr{width:92px;height:92px;background:#fff;border-radius:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:7px}
.qr i{background:#111;border-radius:1px} .qr i.o{background:#fff}

/* ---------- bars ---------- */
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.hbar .l{width:130px;flex:0 0 130px;color:var(--ink3)}
.hbar .tr{flex:1;height:12px;background:#f0e9de;border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold);border-radius:6px}
.hbar .v{width:84px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- responsive ---------- */
@media (max-width:1280px){ .demo-pill{display:none} .demo-mini{display:inline-flex!important} }
@media (max-width:1180px){ .top{gap:9px} .top .clock .small{display:none} .top select,.top .tbtn{padding:7px 9px} }
@media (max-width:1100px){ .top .tbtn .lg{display:none} .top .tbtn .sm{display:inline} .top .langpick svg{display:none} .top select[data-a="role"]{max-width:150px} }
@media (max-width:1000px) and (min-width:861px){ .top .demo-mini{display:none!important} .top select[data-a="role"]{max-width:118px} .top .clock{padding:4px 5px} .brand .sub{display:none} }

/* ---------- scheduling engine ---------- */
/* Build the ordered stage list for a set of services:
   chair work first (same barber, same chair), one rinse, then facials, then grooming. */
function buildStages(serviceIds) {
  const list = serviceIds.map(svc);
  const chair = [], facial = [], groom = [];
  let rinse = 0;
  list.forEach(sv => sv.stages.forEach(st => {
    if (st.k === 'chair') chair.push(Object.assign({}, st, { svc: sv.id }));
    else if (st.rinse) rinse = Math.max(rinse, st.dur);
    else if (st.k === 'wash') facial.push(Object.assign({}, st, { svc: sv.id }));
    else groom.push(Object.assign({}, st, { svc: sv.id }));
  }));
  const out = chair.slice();
  if (rinse) out.push({ k: 'wash', skill: 'wash', dur: rinse, label: 'Rinse and style', rinse: true, svc: null });
  return out.concat(facial, groom);
}

function occupancy(date, excludeId) {
  const occ = {};
  S.visits.forEach(v => {
    if (v.date !== date || v.id === excludeId) return;
    if (['cancelled', 'noshow'].includes(v.status)) return;
    v.stages.forEach(st => {
      if (st.staffId) (occ[st.staffId] = occ[st.staffId] || []).push([st.s, st.e]);
      if (st.stationId) (occ[st.stationId] = occ[st.stationId] || []).push([st.s, st.e]);
    });
  });
  return occ;
}
const freeIn = (occ, id, s, e) => !(occ[id] || []).some(([a, b]) => s < b && e > a);
function onShift(p, s, e) {
  if (s < p.shift[0] || e > p.shift[1]) return false;
  if (p.brk && s < p.brk[1] && e > p.brk[0]) return false;
  return true;
}
function loadOf(date, staffId, excludeId) {
  return S.visits.filter(v => v.date === date && v.id !== excludeId && !['cancelled', 'noshow'].includes(v.status) && v.stages.some(st => st.staffId === staffId)).length;
}

/* Try to place the visit so that its first stage starts exactly at t. */
function planAt(date, t, stages, pref, excludeId, occIn) {
  const occ = occIn || occupancy(date, excludeId);
  if (t < BIZ.open) return null;
  const out = [];
  let cur = t;
  const chair = stages.filter(s => s.k === 'chair');
  const rest = stages.filter(s => s.k !== 'chair');
  if (chair.length) {
    const total = sum(chair, s => s.dur);
    let cands = pref && pref !== 'any' ? [staffById(pref)] : BARBERS.slice().sort((a, b) => loadOf(date, a.id, excludeId) - loadOf(date, b.id, excludeId) || a.id.localeCompare(b.id));
    let chosen = null;
    for (const b of cands) {
      if (!b) continue;
      if (t + total > BIZ.close) continue;
      if (!freeIn(occ, b.chair, t, t + total)) continue;
      if (t < b.shift[0] || t + total > b.shift[1]) continue;
      let c = t, ok = true;
      for (const st of chair) {
        if (!st.proc && (!freeIn(occ, b.id, c, c + st.dur) || !onShift(b, c, c + st.dur))) { ok = false; break; }
        c += st.dur;
      }
      if (ok) { chosen = b; break; }
    }
    if (!chosen) return null;
    for (const st of chair) {
      out.push({ k: 'chair', label: st.label, svc: st.svc, proc: !!st.proc, staffId: st.proc ? null : chosen.id, stationId: chosen.chair, s: cur, e: cur + st.dur, holder: chosen.id });
      cur += st.dur;
    }
  }
  for (let i = 0; i < rest.length; i++) {
    const st = rest[i];
    const firstOverall = out.length === 0;
    let placed = false;
    for (let gap = 0; gap <= (firstOverall ? 0 : BIZ.maxGap); gap += BIZ.step) {
      const s = cur + gap, e = s + st.dur;
      if (e > BIZ.close) break;
      const people = STAFF.filter(p => p.skills.includes(st.skill) && onShift(p, s, e) && freeIn(occ, p.id, s, e))
        .sort((a, b) => loadOf(date, a.id, excludeId) - loadOf(date, b.id, excludeId) || a.id.localeCompare(b.id));
      const places = STATIONS.filter(x => x.type === st.k && freeIn(occ, x.id, s, e));
      if (people.length && places.length) {
        out.push({ k: st.k, label: st.label, svc: st.svc, rinse: !!st.rinse, proc: false, staffId: people[0].id, stationId: places[0].id, s, e });
        // reserve inside this plan so later stages do not collide with it
        (occ[people[0].id] = occ[people[0].id] || []).push([s, e]);
        (occ[places[0].id] = occ[places[0].id] || []).push([s, e]);
        cur = e; placed = true; break;
      }
    }
    if (!placed) {
      // undo the temporary reservations made above
      out.forEach(o => { if (o.k !== 'chair') { ['staffId', 'stationId'].forEach(f => { const arr = occ[o[f]]; if (arr) { const ix = arr.findIndex(x => x[0] === o.s && x[1] === o.e); if (ix > -1) arr.splice(ix, 1); } }); } });
      return null;
    }
  }
  if (!occIn) { /* fresh occupancy, nothing to undo */ }
  else out.forEach(o => { if (o.k !== 'chair') { ['staffId', 'stationId'].forEach(f => { const arr = occ[o[f]]; if (arr) { const ix = arr.findIndex(x => x[0] === o.s && x[1] === o.e); if (ix > -1) arr.splice(ix, 1); } }); } });
  const barber = out.find(o => o.k === 'chair');
  return { date, start: t, end: cur, stages: out, barberId: barber ? barber.holder : null };
}

function findEarliest(date, serviceIds, pref, from, excludeId) {
  const stages = buildStages(serviceIds);
  for (let t = ceilTo(Math.max(from, BIZ.open), BIZ.step); t < BIZ.close; t += BIZ.step) {
    const p = planAt(date, t, stages, pref, excludeId);
    if (p) return p;
  }
  return null;
}
function slotsFor(date, serviceIds, pref, excludeId) {
  const stages = buildStages(serviceIds);

  for (let t = Math.max(from, BIZ.open); t < BIZ.close; t += 15) {
    const p = planAt(date, t, stages, pref, excludeId);
    if (p) out.push(p);
  }
  return out;
}

function linesFromPlan(serviceIds, plan) {
  return serviceIds.map(id => {

    return { svc: id, name: sv.name, cat: sv.cat, price: sv.price, staffId };
  });
}
function createVisit(o) {
  const v = {
    id: 'v' + (++S.seq.visit), ref: 'CE-' + S.seq.visit, date: o.plan.date, clientId: o.clientId,
    services: o.services.slice(), lines: linesFromPlan(o.services, o.plan), stages: o.plan.stages,

    source: o.source || 'Website', status: o.status || 'booked', arrivedAt: o.arrivedAt == null ? null : o.arrivedAt,
    startedAt: null, doneAt: null, stageIdx: -1, ticket: o.ticket || null, remote: !!o.remote, notify: !!o.notify,
    moves: 0, confirmed: false, receiptId: null, createdAt: S.now, by: o.by || 'Reception', note: o.note || ''
  };
  S.visits.push(v);
  return v;
}
function nextTicket() { return 'Q-' + pad(++S.seq.ticket); }
function visitTotal(v) { return sum(v.lines, l => l.price); }
function clientUpcoming(cid) {
  const nowKey = S.today;
  return S.visits.filter(v => v.clientId === cid && ['booked', 'arrived'].includes(v.status) && (v.date > nowKey || (v.date === nowKey && v.start >= S.now - 30)))
    .sort((a, b) => (a.date + fmtT(a.start)).localeCompare(b.date + fmtT(b.start)));
}
function hoursUntil(v) { return (daysBetween(S.today, v.date) * 1440 + v.start - S.now) / 60; }

function checkIn(id, role) { const v = visit(id); v.status = 'arrived'; v.arrivedAt = S.now; audit(role, 'Checked in', v.ref); }
function startVisit(id, role) {
  const v = visit(id);
  const delta = S.now - v.start;
  if (delta !== 0 && v.date === S.today) {
    // keep the same people and stations; move the timing to the real start
    v.stages.forEach(st => { st.s += delta; st.e += delta; });
    v.start += delta; v.end += delta;
  }
  if (v.arrivedAt == null) v.arrivedAt = S.now;
  v.status = 'inservice'; v.startedAt = S.now; v.stageIdx = 0;
  audit(role, 'Service started', v.ref + ' · ' + v.stages[0].label);
}
function nextStage(id, role) {
  const v = visit(id);
  if (v.stageIdx < v.stages.length - 1) { v.stageIdx++; audit(role, 'Next stage', v.ref + ' · ' + v.stages[v.stageIdx].label); }
  else { v.status = 'ready'; v.doneAt = S.now; audit(role, 'Ready to pay', v.ref); }
}
function markNoShow(id, role) { const v = visit(id); v.status = 'noshow'; audit(role, 'No-show recorded', v.ref); }
function cancelVisit(id, role, reason) { const v = visit(id); v.status = 'cancelled'; v.cancelReason = reason || ''; audit(role, 'Visit cancelled', v.ref + (reason ? ' · ' + reason : '')); }
function replan(id, role) {
  const v = visit(id);
  const p = findEarliest(v.date, v.services, v.pref === 'any' ? 'any' : v.barberId, S.now, v.id);
  if (!p) return false;
  const lines = linesFromPlan(v.services, p);
  v.lines.forEach((l, i) => { lines[i].price = l.price; });
  Object.assign(v, { stages: p.stages, start: p.start, end: p.end, barberId: p.barberId, lines });
  audit(role, 'Re-planned', v.ref + ' → ' + fmtT(p.start));
  return true;
}
function moveVisit(id, plan, role, countMove) {
  const v = visit(id);
  const lines = linesFromPlan(v.services, plan);
  v.lines.forEach((l, i) => { if (lines[i] && lines[i].svc === l.svc) lines[i].price = l.price; });
  Object.assign(v, { date: plan.date, stages: plan.stages, start: plan.start, end: plan.end, barberId: plan.barberId, lines, confirmed: false });
  if (countMove) v.moves++;
  audit(role, 'Visit moved', v.ref + ' → ' + dLabel(plan.date) + ' ' + fmtT(plan.start));
}
function changeServices(id, services, plan, role, countMove) {
  const v = visit(id);
  v.services = services.slice();
  const lines = linesFromPlan(services, plan);
  Object.assign(v, { date: plan.date, stages: plan.stages, start: plan.start, end: plan.end, barberId: plan.barberId, lines });
  if (countMove) v.moves++;
  audit(role, 'Services changed', v.ref + ' · ' + services.map(s => svc(s).name).join(', '));
}

/* ---------- till, books and commissions ---------- */
function allocate(v, products, discount) {
  const items = v.lines.map(l => ({ kind: 'svc', name: l.name, cat: l.cat, gross: l.price, staffId: l.staffId, svc: l.svc }))
    .concat(products.map(p => ({ kind: 'prod', name: p.name, cat: 'Product', gross: p.price, staffId: p.staffId })));
  const gross = sum(items, i => i.gross);
  let left = r2(discount);
  items.forEach((it, i) => {
    const share = i === items.length - 1 ? left : r2(discount * it.gross / (gross || 1));
    it.disc = share; it.net = r2(it.gross - share); left = r2(left - share);
  });
  return { items, gross };
}
function commissionLinesFor(v, items, receipt, sign) {
  const out = [];
  const add = (staffId, basis, amount) => { if (staffId && amount) out.push({ id: 'c' + (++S.seq.comm), date: v.date, staffId, visitRef: v.ref, receipt: receipt.no, basis, amount: r2(sign * amount), adj: sign < 0 }); };
  if (v.lines.some(l => l.cat === 'Hair') && v.barberId) add(v.barberId, 'Client served (once per visit)', RULES.barberPerClient);
  const rinse = v.stages.find(st => st.rinse);
  if (rinse) add(rinse.staffId, 'Rinse and style', RULES.rinsePerClient);
  items.forEach(it => {
    if (it.kind === 'svc' && it.cat === 'Facial') add(it.staffId, it.name + ' · ' + RULES.facialPct + '% of ' + K(it.net), it.net * RULES.facialPct / 100);
    if (it.kind === 'svc' && it.cat === 'Grooming') add(it.staffId, it.name + ' · ' + RULES.groomPct + '% of ' + K(it.net), it.net * RULES.groomPct / 100);
    if (it.kind === 'prod') add(it.staffId, it.name + ' · ' + RULES.productPct + '% of ' + K(it.net), it.net * RULES.productPct / 100);
  });
  return out;
}
function postJournal(ref, memo, lines, date, t) {
  const dr = sum(lines, l => l.dr || 0), cr = sum(lines, l => l.cr || 0);
  if (Math.abs(dr - cr) > 0.001) throw new Error('Unbalanced entry ' + ref + ': ' + dr + ' / ' + cr);
  S.journal.push({ id: 'j' + (++S.seq.journal), date: date || S.today, t: t == null ? S.now : t, ref, memo, lines });
}
/* payments: [{method, amount, ref}] */
function checkout(id, o, role) {
  const v = visit(id);
  const products = (o.products || []).map(pid => { const p = PRODUCTS.find(x => x.id === pid); return { id: p.id, name: p.name, price: p.price, staffId: v.barberId || (v.lines[0] && v.lines[0].staffId) }; });
  const discount = r2(o.discount || 0), tip = r2(o.tip || 0);
  const { items, gross } = allocate(v, products, discount);
  const due = r2(gross - discount + tip);
  const paid = sum(o.payments, p => p.amount);
  if (Math.abs(paid - due) > 0.001) throw new Error('Payments ' + paid + ' do not match the amount due ' + due);
  const no = 'CE-R-' + String(++S.seq.receipt).padStart(4, '0');
  const receipt = { id: 'r' + S.seq.receipt, no, visitId: v.id, visitRef: v.ref, clientId: v.clientId, date: v.date, t: o.t == null ? S.now : o.t, items, gross, discount, tip, tipTo: o.tipTo || v.barberId, due, payments: o.payments.map(p => Object.assign({ pid: 'p' + (++S.seq.pay) }, p)), status: 'paid', by: role, discountApprovedBy: o.discountApprovedBy || null };
  S.receipts.push(receipt);
  // books: debit payment accounts and discounts, credit revenue and tips payable
  const lines = [];
  receipt.payments.forEach(p => lines.push({ acc: PAY[p.method].acc, dr: p.amount }));
  if (discount) lines.push({ acc: '4900', dr: discount });
  const byAcc = {};
  items.forEach(it => { const a = CAT_ACC[it.cat]; byAcc[a] = r2((byAcc[a] || 0) + it.gross); });
  Object.keys(byAcc).forEach(a => lines.push({ acc: a, cr: byAcc[a] }));
  if (tip) lines.push({ acc: '2100', cr: tip });
  postJournal(no, 'Sale · ' + v.ref, lines, v.date, receipt.t);
  // commissions
  commissionLinesFor(v, items, receipt, 1).forEach(c => S.commissions.push(c));
  if (tip) S.tips.push({ date: v.date, staffId: receipt.tipTo, amount: tip, receipt: no });
  v.status = 'paid'; v.receiptId = receipt.id; if (!v.doneAt) v.doneAt = receipt.t;
  audit(role, 'Payment recorded', no + ' · ' + K(due) + ' · ' + receipt.payments.map(p => PAY[p.method].label + ' ' + K(p.amount)).join(' + '));
  return receipt;
}
function voidReceipt(rid, reason, role) {
  const r = S.receipts.find(x => x.id === rid);
  if (!r || r.status !== 'paid') return null;
  const v = visit(r.visitId);
  const cn = 'CE-CN-' + String(++S.seq.cn).padStart(4, '0');
  r.status = 'voided'; r.voidReason = reason; r.creditNote = cn;
  const orig = S.journal.find(j => j.ref === r.no);
  postJournal(cn, 'Credit note for ' + r.no + ' · ' + reason, orig.lines.map(l => ({ acc: l.acc, dr: l.cr || 0, cr: l.dr || 0 })).map(l => { const o = { acc: l.acc }; if (l.dr) o.dr = l.dr; if (l.cr) o.cr = l.cr; return o; }));
  const approved = !!S.statementApproved[r.date];
  commissionLinesFor(v, r.items, r, -1).forEach(c => { c.basis = (approved ? 'Adjustment after approval · ' : 'Reversal · ') + c.basis; c.receipt = cn; S.commissions.push(c); });
  if (r.tip) S.tips.push({ date: r.date, staffId: r.tipTo, amount: -r.tip, receipt: cn });
  v.status = 'ready'; v.receiptId = null;
  audit(role, 'Receipt voided', r.no + ' → ' + cn + ' · ' + reason);
  return cn;
}
function approveStatement(date, role) {
  if (S.statementApproved[date]) return;
  const total = sum(S.commissions.filter(c => c.date === date), c => c.amount);
  S.statementApproved[date] = { by: role, t: S.now, total };
  if (total) postJournal('COMM-' + date, 'Commission statement approved · ' + dLabel(date), [{ acc: '5100', dr: total }, { acc: '2200', cr: total }]);
  audit(role, 'Commission statement approved', dLabel(date) + ' · ' + K(total));
}
function trialBalance() {
  const tb = {};
  S.journal.forEach(j => j.lines.forEach(l => { const a = tb[l.acc] = tb[l.acc] || { dr: 0, cr: 0 }; a.dr = r2(a.dr + (l.dr || 0)); a.cr = r2(a.cr + (l.cr || 0)); }));
  return tb;
}
function paymentsOn(date) {
  const out = [];
  S.receipts.filter(r => r.date === date).forEach(r => r.payments.forEach(p => out.push(Object.assign({ receipt: r.no, status: r.status, t: r.t }, p))));
  return out;
}

/* ---------- approvals ---------- */
function requestChange(kind, payload, label, role) {
  const a = { id: 'a' + (++S.seq.appr), kind, payload, label, by: role, t: S.now, status: 'pending' };
  S.approvals.unshift(a);
  audit(role, 'Change requested', label);
  return a;
}
function decide(aid, approve, role) {
  const a = S.approvals.find(x => x.id === aid);
  if (!a || a.status !== 'pending') return;
  a.status = approve ? 'approved' : 'declined'; a.decidedBy = role; a.decidedAt = S.now;
  if (approve && a.kind === 'price') { const s = svc(a.payload.svc); s.price = a.payload.price; }
  audit(role, approve ? 'Change approved' : 'Change declined', a.label);
}

/* ============ TODAY (owner / partner) ============ */
function kpis() {
  const t = todays();
  const paid = S.receipts.filter(r => r.date === S.today && r.status === 'paid');
  const takings = sum(paid, r => r.gross - r.discount);
  const tips = sum(paid, r => r.tip);
  const exp = sum(t.filter(v => ['booked', 'arrived', 'inservice', 'ready'].includes(v.status)), visitTotal);
  const served = t.filter(v => v.status === 'paid');
  const waits = t.filter(v => v.startedAt != null && v.arrivedAt != null && v.startedAt >= v.arrivedAt).map(v => v.startedAt - v.arrivedAt);
  const liveV = t.filter(live);
  const walk = liveV.filter(v => v.source === 'Walk-in' || v.source === 'Queue QR').length;
  const hairV = liveV.filter(v => v.lines.some(l => l.cat === 'Hair'));
  const attach = hairV.filter(v => v.lines.some(l => l.cat !== 'Hair')).length;
  return {
    takings, tips, exp, served: served.length, avgTicket: served.length ? r2(takings / served.length) : 0,
    avgWait: waits.length ? Math.round(waits.reduce((a, b) => a + b, 0) / waits.length) : 0,
    walk, booked: liveV.length - walk, attachPct: hairV.length ? Math.round(attach * 100 / hairV.length) : 0,
    inShop: t.filter(v => ['arrived', 'inservice', 'ready'].includes(v.status)).length, noshow: t.filter(v => v.status === 'noshow').length
  };
}
function vToday() {
  const k = kpis();

  t.filter(v => v.status === 'ready').forEach(v => att.push(`<div class="qitem"><span class="chip warn">Ready to pay</span><div style="flex:1">${esc(cname(v.clientId))} · ${K(visitTotal(v))}</div><button class="btn sm" data-a="checkout" data-id="${v.id}">Checkout</button></div>`));
  t.filter(v => v.status === 'arrived' && S.now - v.start > 10).forEach(v => att.push(`<div class="qitem"><span class="chip bad">Waiting ${S.now - v.arrivedAt} min</span><div style="flex:1">${esc(cname(v.clientId))} for ${esc(sname(v.barberId))}</div><button class="btn sm" data-a="visit" data-id="${v.id}">Open</button></div>`));
  t.filter(v => v.status === 'noshow').forEach(v => att.push(`<div class="qitem"><span class="chip bad">No-show</span><div style="flex:1">${esc(cname(v.clientId))} · ${fmtT(v.start)} with ${esc(sname(v.barberId))}</div><button class="btn sm" data-a="rebook" data-id="${v.id}">Rebook</button></div>`));
  const pend = S.approvals.filter(a => a.status === 'pending');
  pend.forEach(a => att.push(`<div class="qitem"><span class="chip gold">Approval</span><div style="flex:1">${esc(a.label)} <span class="muted small">from ${esc(a.by)}</span></div>${UI.role === 'owner' ? `<button class="btn sm" data-a="go" data-v="settings" data-tab="approvals">Review</button>` : '<span class="small muted">Waiting for the owner</span>'}</div>`));
  const next = t.filter(v => v.status === 'booked' && v.start >= S.now && v.start <= S.now + 60).sort((a, b) => a.start - b.start);
  const byMethod = {}; S.receipts.filter(r => r.date === S.today && r.status === 'paid').forEach(r => r.payments.forEach(p => byMethod[p.method] = r2((byMethod[p.method] || 0) + p.amount)));
  const maxM = Math.max(1, ...Object.values(byMethod));
  const zones = ['chair', 'wash', 'groom'].map(z => { const n = STATIONS.filter(s => s.type === z).length; const busy = t.filter(v => v.status === 'inservice').filter(v => (v.stages[v.stageIdx] || {}).k === z || ((v.stages[v.stageIdx] || {}).proc && z === 'chair')).length; return [z, busy, n]; });
  return `<h1 class="h1">Today</h1><p class="lead">${esc(dLong(S.today))} · ${fmtT(S.now)} · ${esc(BIZ.place)}</p>

    <div class="tile"><div class="l">Takings so far</div><div class="v">${K(k.takings)}</div><div class="s">${k.served} clients paid · tips ${K(k.tips)} kept apart</div></div>
    <div class="tile"><div class="l">Still expected today</div><div class="v">${K(k.exp)}</div><div class="s">From visits booked, waiting or in service</div></div>
    <div class="tile"><div class="l">Average ticket</div><div class="v">${K(k.avgTicket)}</div><div class="s">Add-ons on ${k.attachPct}% of hair visits</div></div>
    <div class="tile"><div class="l">Average wait</div><div class="v">${k.avgWait} min</div><div class="s">${k.walk} walk-ins · ${k.booked} booked · ${k.noshow} no-show</div></div>
  </div>
  <div class="grid g3">
    <div class="card" style="grid-column:span 2"><div class="ch"><span class="t">Needs attention</span><span class="spacer"></span><button class="btn sm" data-a="go" data-v="floor">Open the floor</button></div>
      ${att.length ? att.join('') : '<div class="empty">All clear.</div>'}</div>
    <div class="card"><div class="ch"><span class="t">Floor now</span></div>
      ${zones.map(([z, b, n]) => `<div class="hbar"><span class="l">${esc(STYPE[z])}s</span><span class="tr"><i style="width:${Math.round(b * 100 / n)}%;background:var(--${z})"></i></span><span class="v">${b} of ${n}</span></div>`).join('')}
      <div class="small muted" style="margin-top:8px">${k.inShop} clients in the shop now.</div></div>
    <div class="card"><div class="ch"><span class="t">Takings by method</span></div>
      ${Object.keys(PAY).map(m => `<div class="hbar"><span class="l">${esc(PAY[m].label)}</span><span class="tr"><i style="width:${Math.round((byMethod[m] || 0) * 100 / maxM)}%"></i></span><span class="v">${K(byMethod[m] || 0)}</span></div>`).join('')}
      <div class="tiny muted" style="margin-top:6px">Includes tips collected through the till.</div></div>

      ${next.length ? next.map(v => visitRow(v, `<div class="row small" style="margin-top:4px"><span class="chip">${esc(v.source)}</span><span class="muted">${fmtT(v.start)}–${fmtT(v.end)}</span></div>`)).join('') : '<div class="empty">No bookings in the next hour.</div>'}</div>
  </div>`;
}

/* ============ FLOOR ============ */
function occupantOf(stationId) {
  return todays().find(v => v.status === 'inservice' && v.stages[v.stageIdx] && v.stages[v.stageIdx].stationId === stationId);
}
function nextOn(stationId) {
  return todays().filter(v => ['booked', 'arrived'].includes(v.status)).map(v => ({ v, st: v.stages.find(s => s.stationId === stationId) }))
    .filter(x => x.st && x.st.e > S.now).sort((a, b) => a.st.s - b.st.s)[0];
}
function stationCard(st) {
  const v = occupantOf(st.id);
  if (v) {
    const s = v.stages[v.stageIdx];
    const left = s.e - S.now;
    const pct = Math.max(0, Math.min(100, Math.round((S.now - s.s) * 100 / (s.e - s.s))));
    const last = v.stageIdx === v.stages.length - 1;
    return `<div class="st busy ${st.type}"><div class="sn"><span class="dot" style="background:var(--${st.type})"></span>${esc(st.name)}<span class="spacer"></span>${v.ticket ? `<span class="chip dark">${esc(v.ticket)}</span>` : ''}</div>
      <button type="button" class="who" data-a="visit" data-id="${v.id}" aria-label="Open visit: ${esc(initials(cname(v.clientId)))} at ${esc(st.name)}">${esc(initials(cname(v.clientId)))}</button>
      <div class="what">${esc(s.label)} · ${s.proc ? 'barber free' : esc(sname(s.staffId))}</div>
      <div class="small ${left < 0 ? '' : 'muted'}" style="${left < 0 ? 'color:var(--bad)' : ''}">${left >= 0 ? left + ' min left' : 'Over by ' + (-left) + ' min'} · ends ${fmtT(s.e)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="acts"><button class="btn sm" data-a="next" data-id="${v.id}">${last ? 'Finish' : 'Next stage'}</button></div></div>`;
  }
  const n = nextOn(st.id);
  const startable = n && n.v.status === 'arrived' && n.v.stages[0].stationId === st.id && n.st === n.v.stages[0] && n.v.start <= S.now + 10;
  return `<div class="st free"><div class="sn">${esc(st.name)}<span class="spacer"></span><span class="chip ok">Free</span></div>
    ${n ? `<div class="small"><span class="muted">Next</span> <b>${fmtT(n.st.s)}</b> ${esc(initials(cname(n.v.clientId)))}</div><div class="what">${esc(n.st.label)} · ${esc(sname(n.st.staffId) || 'chair held')}</div>` : '<div class="small muted">Nothing booked for the rest of the day</div>'}
    ${startable ? `<div class="acts" style="margin-top:auto"><button class="btn sm pri" data-a="start" data-id="${n.v.id}">Start ${esc(initials(cname(n.v.clientId)))}</button></div>` : ''}</div>`;
}
function vFloor() {
  const t = todays();
  const waiting = t.filter(v => v.status === 'arrived').sort((a, b) => a.start - b.start);
  const ready = t.filter(v => v.status === 'ready');
  const soon = t.filter(v => v.status === 'booked' && v.start <= S.now + 60).sort((a, b) => a.start - b.start);
  const zone = (type, cols, title) => `<div class="zone"><div class="zh"><span class="dot" style="background:var(--${type})"></span>${title}</div><div class="stations ${cols}">${STATIONS.filter(s => s.type === type).map(stationCard).join('')}</div></div>`;
  const eta = v => { const d = v.start - S.now; return d > 0 ? `<span class="chip">Starts ${fmtT(v.start)} · in ${d} min</span>` : d === 0 ? '<span class="chip ok">Due now</span>' : `<span class="chip bad">Due ${-d} min ago</span>`; };
  return `<div class="row wrap" style="margin-bottom:12px"><div><h1 class="h1">Floor & Queue</h1><div class="muted">One screen for 5 chairs, 3 wash stations and 2 grooming stations.</div></div><span class="spacer"></span>
    <button class="btn gold" data-a="walkin">+ Walk-in</button><button class="btn" data-a="booknew">+ Booking</button><button class="btn" data-a="tv">Queue screen</button></div>
  <div class="floor"><div>${zone('chair', 'c5', 'Barber chairs')}${zone('wash', 'c3', 'Wash stations')}${zone('groom', 'c2', 'Grooming stations')}</div>
  <div>
    <div class="card" style="margin-bottom:12px"><div class="ch"><span class="t">Waiting in the shop</span><span class="chip dark">${waiting.length}</span></div>
      ${waiting.length ? waiting.map(v => visitRow(v, `<div class="row wrap small" style="margin-top:5px;gap:6px">${eta(v)}<span class="muted">waiting ${Math.max(0, S.now - v.arrivedAt)} min</span>${v.remote ? '<span class="chip wash">In the mall · WhatsApp 10 min before</span>' : ''}</div>
        <div class="row wrap" style="margin-top:6px;gap:6px">${v.start <= S.now + 10 ? `<button class="btn sm pri" data-a="start" data-id="${v.id}">Start</button>` : ''}${v.start < S.now ? `<button class="btn sm" data-a="replan" data-id="${v.id}">Re-plan from now</button>` : ''}<button class="btn sm ghost" data-a="visit" data-id="${v.id}">Details</button></div>`)).join('') : '<div class="empty">Nobody waiting.</div>'}</div>
    <div class="card" style="margin-bottom:12px"><div class="ch"><span class="t">Ready to pay</span><span class="chip warn">${ready.length}</span></div>
      ${ready.length ? ready.map(v => visitRow(v, `<div class="row" style="margin-top:6px"><b>${K(visitTotal(v))}</b><span class="spacer"></span><button class="btn sm gold" data-a="checkout" data-id="${v.id}">Checkout</button></div>`)).join('') : '<div class="empty">Nobody at the till.</div>'}</div>
    <div class="card"><div class="ch"><span class="t">Booked, next 60 minutes</span></div>
      ${soon.length ? soon.map(v => visitRow(v, `<div class="row wrap" style="margin-top:6px;gap:6px"><span class="chip">${esc(v.source)}</span><button class="btn sm" data-a="checkin" data-id="${v.id}">Check in</button>${v.start < S.now ? `<button class="btn sm danger" data-a="noshow" data-id="${v.id}">No-show</button>` : ''}</div>`)).join('') : '<div class="empty">No bookings in the next hour.</div>'}</div>
  </div></div>`;
}

/* ============ CALENDAR ============ */
const PXM = 3;
function vCalendar() {
  const d = UI.calDate || S.today;
  const W = (BIZ.close - BIZ.open) * PXM;
  const hours = []; for (let h = BIZ.open; h < BIZ.close; h += 60) hours.push(h);
  const vs = S.visits.filter(v => v.date === d && live(v));
  const x = m => (m - BIZ.open) * PXM;
  const blk = (st, v) => `<div class="blk ${st.proc ? 'chair proc' : st.k} ${v.status === 'paid' ? 'paid' : ''}" style="left:${x(st.s)}px;width:${Math.max(18, (st.e - st.s) * PXM - 2)}px" data-a="visit" data-id="${v.id}" tabindex="0" role="button" title="${esc(cname(v.clientId))} · ${esc(st.label)} ${fmtT(st.s)}–${fmtT(st.e)}">${esc(initials(cname(v.clientId)))} · ${esc(st.label)}</div>`;
  let lanes = '';
  if (UI.calBy === 'station') {
    lanes = STATIONS.map(s => `<div class="lane"><div class="lbl"><b>${esc(s.name)}</b><span class="muted">${esc(STYPE[s.type])}</span></div><div class="track" style="width:${W}px">
      ${hours.map(h => `<div class="gridline" style="left:${x(h)}px"></div>`).join('')}
      ${vs.flatMap(v => v.stages.filter(st => st.stationId === s.id).map(st => blk(st, v))).join('')}</div></div>`).join('');
  } else {
    lanes = STAFF.filter(p => p.role !== 'reception').map(p => `<div class="lane"><div class="lbl"><b>${esc(p.name)}</b><span class="muted">${esc(p.title)}</span></div><div class="track" style="width:${W}px">
      ${hours.map(h => `<div class="gridline" style="left:${x(h)}px"></div>`).join('')}
      ${p.shift[0] > BIZ.open ? `<div class="blk off" style="left:0;width:${x(p.shift[0])}px"></div>` : ''}${p.shift[1] < BIZ.close ? `<div class="blk off" style="left:${x(p.shift[1])}px;width:${x(BIZ.close) - x(p.shift[1])}px"></div>` : ''}
      ${p.brk ? `<div class="blk brk" style="left:${x(p.brk[0])}px;width:${(p.brk[1] - p.brk[0]) * PXM - 2}px">Break</div>` : ''}
      ${vs.flatMap(v => v.stages.filter(st => st.staffId === p.id || (st.proc && st.holder === p.id)).map(st => blk(st, v))).join('')}</div></div>`).join('');
  }
  const dates = []; for (let i = -1; i < 7; i++) dates.push(addDays(S.today, i));
  return `<div class="row wrap" style="margin-bottom:12px"><div><h1 class="h1">Calendar</h1><div class="muted">Every stage holds a person and a station. Online bookings and the desk use the same calendar.</div></div><span class="spacer"></span>
    <div class="seg"><button class="${UI.calBy === 'station' ? 'on' : ''}" data-a="calby" data-v="station">By station</button><button class="${UI.calBy === 'staff' ? 'on' : ''}" data-a="calby" data-v="staff">By team member</button></div></div>
  <div class="row wrap" style="margin-bottom:10px;gap:6px">${dates.map(k => `<button class="btn sm ${k === d ? 'pri' : ''}" data-a="caldate" data-v="${k}">${k === S.today ? 'Today' : esc(dLabel(k))}</button>`).join('')}
    <span class="spacer"></span><span class="chip chair">Chair</span><span class="chip wash">Wash / facial</span><span class="chip groom">Grooming</span><span class="chip" style="background:repeating-linear-gradient(45deg,#f3e6d1,#f3e6d1 5px,#fbf5ea 5px,#fbf5ea 10px)">Colour develops</span></div>
  <div class="cal" id="cal" tabindex="0" role="region" aria-label="Calendar"><div class="inner" style="width:${W + 120}px">
    <div class="hdr"><div class="lbl"></div>${hours.map(h => `<div class="hr" style="width:${60 * PXM}px">${fmtT(h)}</div>`).join('')}</div>
    <div style="position:relative">${lanes}${d === S.today && S.now >= BIZ.open && S.now <= BIZ.close ? `<div class="nowline" style="left:${120 + x(S.now)}px"></div>` : ''}</div>
  </div></div>
  <div class="small muted" style="margin-top:8px">Durations are demo assumptions. In the project we measure them in the shop and set them with you.</div>`;
}

/* ============ CLIENTS ============ */
function vClients() {
  const q = UI.clientQ.trim().toLowerCase();
  const list = S.clients.filter(c => !q || c.name.toLowerCase().includes(q) || c.ph.includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  const sel = UI.clientSel ? client(UI.clientSel) : null;
  const lastVisit = c => { const v = S.visits.filter(x => x.clientId === c.id && x.status === 'paid').map(x => x.date).concat(c.hist.map(h => h.date)).sort().pop(); return v ? dLabel(v) : '—'; };
  return `<h1 class="h1">Clients</h1><p class="lead">One card per client: visits, receipts, style notes and consents.</p>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)">
    <div class="card"><input class="in" data-f="clientQ" aria-label="Search clients" placeholder="Search by name or last digits" value="${esc(UI.clientQ)}">
      <div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>Name</th><th>Barber</th><th>Last visit</th></tr></thead><tbody>
      ${list.map(c => `<tr data-a="clientsel" data-id="${c.id}" tabindex="0" style="cursor:pointer;${sel && sel.id === c.id ? 'background:#faf3e6' : ''}"><td><b>${esc(c.name)}</b><div class="tiny muted">${esc(phoneMask(c))}</div></td><td>${esc(c.pref ? sname(c.pref) : '—')}</td><td class="nowrap">${esc(lastVisit(c))}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div>${sel ? clientCard(sel) : '<div class="card"><div class="empty">Choose a client to open the card.</div></div>'}</div>
  </div>`;
}
function clientCard(c) {
  const visits = S.visits.filter(v => v.clientId === c.id).sort((a, b) => (b.date + fmtT(b.start)).localeCompare(a.date + fmtT(a.start)));
  const g = c.guardian ? client(c.guardian) : null;
  const kids = S.clients.filter(k => k.guardian === c.id);
  const spend = sum(S.receipts.filter(r => r.clientId === c.id && r.status === 'paid'), r => r.gross - r.discount) + sum(c.hist, h => h.total);
  return `<div class="card"><div class="row"><div class="avatar" style="margin:0">${esc(c.name[0])}</div><div><div class="h2" style="margin:0">${esc(c.name)}</div><div class="small muted">${esc(phoneMask(c))} · client since ${c.sinceDays} days</div></div><span class="spacer"></span><button class="btn sm" data-a="bookfor" data-id="${c.id}">Book</button></div>
    <div class="sep"></div>
    <div class="kv"><div class="k">Preferred barber</div><div>${esc(c.pref ? sname(c.pref) : 'Any')}</div>
      <div class="k">Total spend</div><div>${K(spend)} <span class="muted small">(demo history)</span></div>
      ${g ? `<div class="k">Booked by</div><div>${esc(g.name)} <span class="chip">Parent</span></div>` : ''}
      ${kids.length ? `<div class="k">Children</div><div>${kids.map(k => esc(k.name)).join(', ')}</div>` : ''}
      <div class="k">WhatsApp offers</div><div>${c.mk ? '<span class="chip ok">Agreed</span>' : '<span class="chip">Not agreed</span>'}</div>
      <div class="k">Photos of work</div><div>${c.photo ? '<span class="chip ok">Consent given</span>' : '<span class="chip">No consent</span>'}</div></div>
    <label class="lb">Style notes (the cut recipe)</label>
    <textarea class="in" rows="2" aria-label="Style notes (the cut recipe)" data-f="recipe" data-id="${c.id}">${esc(c.recipe)}</textarea>
    <div class="row" style="margin-top:6px"><span class="tiny muted">Seen by the barber before the client sits down.</span><span class="spacer"></span><button class="btn sm" data-a="saverecipe" data-id="${c.id}">Save</button></div>
    ${c.notes ? `<label class="lb">Notes</label><div class="small">${esc(c.notes)}</div>` : ''}
    <div class="sep"></div><div class="b" style="margin-bottom:6px">Visits</div>
    ${visits.map(v => `<div class="qitem"><div class="small nowrap" style="width:96px">${esc(dLabel(v.date))}<br><span class="muted">${fmtT(v.start)}</span></div><div style="flex:1"><div class="small b">${esc(svcNames(v.services))}</div><div class="tiny muted">${esc(v.barberId ? sname(v.barberId) : 'Grooming')} · ${K(visitTotal(v))}</div></div>${statusChip(v)}</div>`).join('')}
    ${c.hist.map(h => `<div class="qitem"><div class="small nowrap" style="width:96px">${esc(dLabel(h.date))}</div><div style="flex:1"><div class="small b">${esc(svcNames(h.services))}</div><div class="tiny muted">${esc(h.barberId ? sname(h.barberId) : 'Grooming')} · ${K(h.total)}</div></div><span class="chip ok">Completed</span></div>`).join('')}
  </div>`;
}

/* ============ COMMISSIONS ============ */
function vCommissions() {
  const d = S.today;
  const lines = S.commissions.filter(c => c.date === d);
  const tips = S.tips.filter(t => t.date === d);
  const people = STAFF.filter(s => s.role !== 'reception');
  const appr = S.statementApproved[d];
  const rows = people.map(p => {
    const ls = lines.filter(l => l.staffId === p.id);
    const clientsServed = ls.filter(l => l.basis.includes('Client served') && l.amount > 0).length - ls.filter(l => l.basis.includes('Client served') && l.amount < 0).length;
    return { p, ls, comm: sum(ls, l => l.amount), tips: sum(tips.filter(t => t.staffId === p.id), t => t.amount), clients: Math.max(0, clientsServed) };
  });
  const total = sum(rows, r => r.comm), ttips = sum(rows, r => r.tips);
  const open = UI.commOpen || {};
  return `<h1 class="h1">Commissions</h1><p class="lead">Calculated from paid visits only. Each client counts once for his barber, even with several services.</p>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="tile"><div class="l">Commission today</div><div class="v">${K(total)}</div><div class="s">${appr ? 'Approved by the owner at ' + fmtT(appr.t) : 'Estimated until the owner approves'}</div></div>
    <div class="tile"><div class="l">Tips today</div><div class="v">${K(ttips)}</div><div class="s">Paid to the team in full, outside commission</div></div>
    <div class="tile"><div class="l">Base pay</div><div class="v" style="font-size:16px;margin-top:10px">${UI.role === 'owner' || UI.role === 'accountant' ? 'In the pay records' : 'Hidden for this role'}</div><div class="s">Owner and accountant only</div></div>
  </div>
  <div class="note" style="margin-bottom:12px"><b>Sample rules for the demo.</b> Barber: K${RULES.barberPerClient} per client. Rinse: K${RULES.rinsePerClient} per client. Facials and grooming: ${RULES.groomPct}% of the service after discount. Products: ${RULES.productPct}% to the seller. Your signed commission agreement replaces these.</div>
  <div class="card"><div class="ch"><span class="t">Statement · ${esc(dLabel(d))}</span><span class="spacer"></span>
    ${appr ? '<span class="chip ok">Approved</span>' : can('approveStatement') ? `<button class="btn sm pri" data-a="approvestmt">Approve statement</button>` : '<span class="chip">Owner approves</span>'}
    ${(UI.role === 'owner' || UI.role === 'accountant') ? '<button class="btn sm" data-a="csv" data-k="commissions">Export for payroll</button>' : ''}</div>
    <div class="tablewrap"><table class="t"><thead><tr><th>Team member</th><th>Role</th><th class="num">Clients</th><th class="num">Commission</th><th class="num">Tips</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(r.p.name)}</b></td><td class="small muted">${esc(r.p.title)}</td><td class="num">${r.p.role === 'barber' ? r.clients : '—'}</td><td class="num">${K(r.comm)}</td><td class="num">${K(r.tips)}</td><td class="right">${r.ls.length ? `<button class="btn sm ghost" data-a="commopen" data-id="${r.p.id}">${open[r.p.id] ? 'Hide' : 'Lines'}</button>` : ''}</td></tr>
      ${open[r.p.id] ? r.ls.map(l => `<tr><td></td><td colspan="2" class="small">${esc(l.visitRef)} · ${esc(l.receipt)}<br><span class="muted">${esc(l.basis)}</span></td><td class="num small">${K(l.amount)}</td><td colspan="2"></td></tr>`).join('') : ''}`).join('')}
    </tbody><tfoot><tr><td>Total</td><td></td><td></td><td class="num">${K(total)}</td><td class="num">${K(ttips)}</td><td></td></tr></tfoot></table></div></div>`;
}

/* ============ REPORTS ============ */
function vReports() {
  const t = todays().filter(live);
  const paid = S.receipts.filter(r => r.date === S.today && r.status === 'paid');
  const k = kpis();
  const byCat = {}; paid.forEach(r => r.items.forEach(i => byCat[i.cat] = r2((byCat[i.cat] || 0) + i.net)));
  const byBarber = BARBERS.map(b => ({ b, n: t.filter(v => v.barberId === b.id).length, rev: sum(paid.filter(r => visit(r.visitId).barberId === b.id), r => r.gross - r.discount) }));
  const bySrc = {}; t.forEach(v => bySrc[v.source] = (bySrc[v.source] || 0) + 1);
  const open = BIZ.close - BIZ.open;
  const util = ['chair', 'wash', 'groom'].map(z => { const n = STATIONS.filter(s => s.type === z).length; const used = sum(t.flatMap(v => v.stages.filter(s => s.k === z || (z === 'chair' && s.proc))), s => s.e - s.s); return [z, Math.round(used * 100 / (n * open))]; });
  const bars = (obj, fmt) => { const mx = Math.max(1, ...Object.values(obj)); return Object.keys(obj).map(key => `<div class="hbar"><span class="l">${esc(key)}</span><span class="tr"><i style="width:${Math.round(obj[key] * 100 / mx)}%"></i></span><span class="v">${fmt(obj[key])}</span></div>`).join(''); };
  const fin = UI.role === 'accountant';
  return `<div class="row wrap"><div><h1 class="h1">Reports</h1><p class="lead">${esc(dLong(S.today))} · live from the till and the calendar</p></div><span class="spacer"></span><button class="btn sm" data-a="csv" data-k="visits">Export visits</button></div>
  <div class="grid g4" style="margin-bottom:14px">
    <div class="tile"><div class="l">Takings</div><div class="v">${K(k.takings)}</div><div class="s">Paid visits, after discounts</div></div>
    <div class="tile"><div class="l">Expected</div><div class="v">${K(k.exp)}</div><div class="s">Rest of today, not yet paid</div></div>
    <div class="tile"><div class="l">Average ticket</div><div class="v">${K(k.avgTicket)}</div><div class="s">${k.served} paid visits</div></div>
    <div class="tile"><div class="l">${fin ? 'Tips held for staff' : 'Add-on rate'}</div><div class="v">${fin ? K(k.tips) : k.attachPct + '%'}</div><div class="s">${fin ? 'Liability until paid out' : 'Hair visits with facial or grooming'}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="ch"><span class="t">Revenue by category</span></div>${bars(byCat, K)}</div>
    ${fin ? '' : `<div class="card"><div class="ch"><span class="t">Barbers today</span></div><div class="tablewrap"><table class="t"><thead><tr><th>Barber</th><th class="num">Clients booked</th><th class="num">Paid so far</th></tr></thead><tbody>${byBarber.map(x => `<tr><td>${esc(x.b.name)}</td><td class="num">${x.n}</td><td class="num">${K(x.rev)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="ch"><span class="t">Where clients came from</span></div>${bars(bySrc, n => n + ' visits')}</div>
    <div class="card"><div class="ch"><span class="t">Station use today</span></div>${util.map(([z, p]) => `<div class="hbar"><span class="l">${esc(STYPE[z])}s</span><span class="tr"><i style="width:${p}%;background:var(--${z})"></i></span><span class="v">${p}%</span></div>`).join('')}<div class="tiny muted" style="margin-top:6px">Booked minutes as a share of opening hours.</div></div>`}
  </div>`;
}

/* ============ BOOKS ============ */
function vBooks() {
  const tab = UI.booksTab;
  const tb = trialBalance();
  const dr = sum(Object.values(tb), a => a.dr), cr = sum(Object.values(tb), a => a.cr);
  const masked = UI.role === 'accountant';

/* ============ CASH-UP ============ */
function vCashup() {
  const pays = paymentsOn(S.today).filter(p => p.status === 'paid');
  const cashIn = sum(pays.filter(p => p.method === 'cash'), p => p.amount);
  const voidedCash = 0;
  const expected = r2(BIZ.float + cashIn - voidedCash);
  const cu = S.cashups[S.today];
  const counted = UI.cu.counted != null ? UI.cu.counted : '';
  const varc = counted === '' ? null : r2(Number(counted) - expected);
  const elec = pays.filter(p => p.method !== 'cash');
  return `<h1 class="h1">Cash-up & Reconcile</h1><p class="lead">Count the drawer, match mobile money and card to their statements, close the day.</p>
  <div class="grid g2">
    <div class="card"><div class="ch"><span class="t">Cash drawer · ${esc(dLabel(S.today))}</span></div>
      <div class="kv"><div class="k">Opening float</div><div>${K(BIZ.float)}</div><div class="k">Cash taken</div><div>${K(cashIn)}</div><div class="k">Expected in drawer</div><div class="b">${K(expected)}</div></div>
      ${cu ? `<div class="note green" style="margin-top:12px">Closed at ${fmtT(cu.t)} by ${esc(cu.by)} · counted ${K(cu.counted)} · difference ${K(cu.variance)}${cu.reason ? ' · ' + esc(cu.reason) : ''}</div>` : `
      <label class="lb">Counted cash</label><input class="in" type="text" inputmode="decimal" aria-label="Counted cash" data-f="counted" value="${esc(counted)}" placeholder="${expected}">
      ${varc != null ? `<div class="small" style="margin-top:6px">Difference: <b style="color:${varc === 0 ? 'var(--ok)' : 'var(--bad)'}">${K(varc)}</b></div>` : ''}
      ${varc ? `<label class="lb">Reason for the difference</label><input class="in" aria-label="Reason for the difference" data-f="cureason" value="${esc(UI.cu.cureason || '')}">` : ''}
      <div class="row" style="margin-top:12px"><button class="btn pri" data-a="closeday" ${counted === '' ? 'disabled' : ''}>Close the day</button></div>`}
    </div>
    <div class="card"><div class="ch"><span class="t">Mobile money and card</span></div>
      <table class="t"><thead><tr><th>Method</th><th>Reference</th><th class="num">Amount</th><th>Matched</th></tr></thead><tbody>
      ${elec.map(p => `<tr><td class="small">${esc(PAY[p.method].label)}<div class="tiny muted">${esc(p.receipt)}</div></td><td class="small">${esc(p.ref || '—')}</td><td class="num">${K(p.amount)}</td><td><input type="checkbox" data-a="match" data-id="${p.pid}" aria-label="Matched to statement: ${esc(PAY[p.method].label)} ${esc(p.ref || '')} ${K(p.amount)}" ${S.momoMatched[p.pid] ? 'checked' : ''}></td></tr>`).join('')}
      </tbody></table>
      <div class="small muted" style="margin-top:8px">${elec.filter(p => S.momoMatched[p.pid]).length} of ${elec.length} matched to statements.</div></div>
  </div>`;
}

function servicePicker(sel, act) {

function planSummary(p) { return p.stages.map(stageLine).join(''); }
function bookingFlow(s) {
  const steps = ['Services', 'Barber', 'Time', 'Your details', 'Booked'];
  const hasHair = s.services.some(id => svc(id).cat === 'Hair');
  const head = `<div class="row"><div class="h2" style="margin:0">Book a visit</div><span class="spacer"></span>${s.step > 0 && s.step < 4 ? '<button class="btn sm ghost" data-a="siteback">Back</button>' : ''}</div>
    <div class="steps" style="margin-top:10px">${steps.map((x, i) => `<span class="${i === s.step ? 'on' : i < s.step ? 'done' : ''}">${i + 1}. ${x}</span>`).join('')}</div>`;
  if (s.step === 0) return head + servicePicker(s.services, 'sitesvc') + `<div class="row" style="margin-top:14px"><div>${s.services.length ? `<b>${K(serviceTotal(s.services))}</b> <span class="muted small">· about ${serviceMinutes(s.services)} min</span>` : '<span class="muted small">Choose one or more services</span>'}</div><span class="spacer"></span><button class="btn pri" data-a="sitenext" ${s.services.length ? '' : 'disabled'}>Continue</button></div>`;
  if (s.step === 1) return head + `<div class="pick"><button class="opt ${s.pref === 'any' ? 'on' : ''}" data-a="sitepref" data-v="any"><div class="small b">First available</div><div class="p">Shortest wait</div></button>${BARBERS.map(b => `<button class="opt ${s.pref === b.id ? 'on' : ''}" data-a="sitepref" data-v="${b.id}"><div class="small b">${esc(b.name)}</div><div class="p">${esc(b.bio)}</div></button>`).join('')}</div>${hasHair ? '' : '<div class="small muted" style="margin-top:8px">No barber needed for these services.</div>'}<div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn pri" data-a="sitenext">Continue</button></div>`;

function checkoutModal() {
  const m = UI.m; const v = visit(m.vid);
  const products = m.products.map(id => PRODUCTS.find(p => p.id === id));
  const gross = r2(visitTotal(v) + sum(products, p => p.price));
  const disc = r2(Number(m.discount) || 0), tip = r2(Number(m.tip) || 0);
  const due = r2(gross - disc + tip);
  const paid = sum(m.pays, p => Number(p.amount) || 0);
  const left = r2(due - paid);
  const needAppr = disc > gross * BIZ.discountApproval / 100 && !can('discount') && !m.discApproved;
  const refMissing = m.pays.some(p => PAY[p.method].ref && Number(p.amount) > 0 && !String(p.ref || '').trim());
  const okToPay = Math.abs(left) < 0.001 && !needAppr && !refMissing && disc <= gross && m.pays.every(p => Number(p.amount) > 0);
  return `<div class="mh"><div class="t">Checkout · ${esc(cname(v.clientId))}</div><span class="chip">${esc(v.ref)}</span><span class="spacer"></span><button class="x" data-a="close">×</button></div>

      const v = createVisit({ plan: p, services: s.services, clientId: cid, pref: hair ? s.pref : 'any', source: 'Queue QR', status: 'arrived', arrivedAt: S.now, ticket: nextTicket(), notify: true, remote: true, by: 'Client' });
      audit('Client', 'Joined the queue', v.ticket + ' · ' + fmtT(v.start));
      s.qdone = v.id; return commit('You are in the queue: ' + v.ticket);
    }
    case 'portalas': UI.side = 'portal'; UI.portal = { clientId: d.id, tab: 'home', sub: null }; audit('Client', 'Signed in to ' + BIZ.portalName, cname(d.id)); window.scrollTo(0, 0); return commit();

    /* ---- portal ---- */
    case 'portalcode': { const P = portalState(); if (!P.phone.trim()) P.phone = '0970 000 000'; P.codeSent = true; return render(); }
    case 'portalverify': {
      const P = portalState();
      if (P.code.trim() !== DEMO_CODE) { toast('Use the demo code ' + DEMO_CODE); return; }
      const last = P.phone.replace(/\D/g, '').slice(-3);
      const c = S.clients.find(x => x.ph === last && !x.child);
      if (!c) { toast('No client file for this number yet. Book a visit first.'); UI.side = 'site'; return render(); }
      UI.portal = { clientId: c.id, tab: 'home', sub: null }; audit('Client', 'Signed in to ' + BIZ.portalName, c.name); return commit();
    }
    case 'ptab': portalState().tab = d.v; portalState().sub = null; return render();
    case 'pconfirm': { const v = visit(d.id); v.confirmed = true; audit('Client', "Confirmed: I'll be there", v.ref); return commit('Thanks. The shop sees that you are coming.'); }
    case 'psub': { const v = visit(d.id); if (hoursUntil(v) < BIZ.cancelHours) { toast('Less than 24 hours to go. Please message us.'); return; } if (d.v === 'time' && v.moves >= BIZ.maxMoves) { toast('This visit was moved twice. Please message us.'); return; } portalState().sub = { kind: d.v, id: d.id, date: v.date, pick: null }; return render(); }
    case 'psubclose': portalState().sub = null; return render();
    case 'pdate': { const sb = portalState().sub; sb.date = d.v; sb.pick = null; return render(); }
    case 'ppick': portalState().sub.pick = Number(d.i); return render();
    case 'pmove': {
      const P = portalState(); const sb = P.sub; const v = visit(sb.id);
      const services = sb.pendingServices || v.services;
      const slots = slotsFor(sb.date, services, v.pref === 'any' ? 'any' : v.barberId, v.id).filter(p => !(p.date === v.date && p.start === v.start));
      const plan = slots[sb.pick]; if (!plan) { toast('Choose a time'); return; }
      if (sb.pendingServices) changeServices(v.id, services, plan, 'Client', true); else moveVisit(v.id, plan, 'Client', true);
      P.sub = null; return commit('Done. The calendar and the team are updated.');
    }
    case 'psvc': { const sb = portalState().sub; const v = visit(sb.id); sb.services = sb.services || v.services.slice(); const i = sb.services.indexOf(d.id); i > -1 ? sb.services.splice(i, 1) : sb.services.push(d.id); return render(); }
    case 'psvcsave': {
      const P = portalState(); const sb = P.sub; const v = visit(sb.id); const sel = sb.services || v.services;
      const same = planAt(v.date, v.start, buildStages(sel), v.barberId || 'any', v.id);
      if (same) { changeServices(v.id, sel, same, 'Client', false); P.sub = null; return commit('Saved. Same time, new services.'); }
      if (v.moves >= BIZ.maxMoves) { toast('No moves left on this visit. Please message us.'); return; }
      P.sub = { kind: 'time', id: v.id, date: v.date, pick: null, pendingServices: sel.slice() }; return render();
    }
    case 'pcancel': { const P = portalState(); cancelVisit(d.id, 'Client', (P.reason || '').trim()); P.sub = null; P.reason = ''; return commit('Cancelled. The time is free for others.'); }
    case 'pbook': { const cid = portalState().clientId; UI.site = null; const s = siteState(); s.clientId = cid; const c = client(cid); s.pref = c.pref || 'any'; UI.side = 'site'; render(); const b = document.getElementById('booking'); if (b) b.scrollIntoView({ block: 'start' }); return; }
    case 'pbookagain': { const cid = portalState().clientId; UI.site = null; const s = siteState(); s.clientId = cid; s.services = d.svcs.split(',').filter(Boolean); s.pref = d.b || 'any'; s.step = 2; UI.side = 'site'; render(); const b = document.getElementById('booking'); if (b) b.scrollIntoView({ block: 'start' }); return; }
    case 'ppref': { const c = client(portalState().clientId); c.pref = el.value === 'any' ? null : el.value; audit('Client', 'Preferred barber', c.pref ? sname(c.pref) : 'Any'); return commit('Saved'); }
    case 'pmk': { const c = client(portalState().clientId); c.mk = el.checked; audit('Client', el.checked ? 'Agreed to offers on WhatsApp' : 'Stopped offers on WhatsApp', c.name); return commit(el.checked ? 'Offers on' : 'Offers off. Visit reminders continue.'); }
    case 'psignout': UI.portal = { clientId: null, tab: 'home', phone: '', code: '', codeSent: false, sub: null }; return render();
  }
}

function scenario(k) {
  UI.demoMenu = false; UI.modal = null; UI.tv = false;
  const byName = n => S.clients.find(c => c.name === n);
  if (k === 's1') { UI.side = null; setRole('reception'); go('inbox'); UI.leadSel = 'l1'; }
  if (k === 's2') { UI.site = null; UI.side = 'site'; }
  if (k === 's3') { UI.side = 'portal'; UI.portal = { clientId: byName('Daniel Mwansa').id, tab: 'home', sub: null }; }
  if (k === 's4') { UI.side = null; setRole('reception'); go('floor'); openBuilder('walkin', { services: ['hc'], pref: 'b2' }); }
  if (k === 's5') { UI.side = null; setRole('reception'); go('till'); const v = S.visits.find(x => x.date === S.today && x.clientId === byName('Brian Zulu').id && x.services.join() === 'cs,nw'); if (v) openCheckout(v.id); }
  if (k === 's6') { UI.side = null; setRole('owner'); go('today'); }
  if (k === 's7') { UI.side = null; setRole('partner'); go('settings'); UI.setTab = 'services'; }
  if (k === 's8') { UI.side = null; setRole('accountant'); go('books'); UI.booksTab = 'journal'; }
  if (k === 'tv') { UI.tv = true; }
  window.scrollTo(0, 0);
  render();
}

/* ---------- inputs ---------- */
function setField(el) {
  const f = el.dataset.f; const val = el.value;
  if (f === 'clientQ') UI.clientQ = val;
  else if (f === 'recipe') UI.drafts.recipe[el.dataset.id] = val;
  else if (f === 'counted') UI.cu.counted = val === '' ? null : val;
  else if (f === 'cureason') UI.cu.cureason = val;
  else if (f === 'price') UI.drafts.price[el.dataset.id] = val;
  else if (f.startsWith('site.')) siteState()[f.slice(5)] = val;
  else if (f.startsWith('portal.')) portalState()[f.slice(7)] = val;
  else if (f.startsWith('pay.')) UI.m.pays[Number(el.dataset.i)][f.slice(4)] = val;
  else if (f.startsWith('m.')) UI.m[f.slice(2)] = val;
}
const QUIET = new Set(['recipe', 'price', 'site.phone', 'site.code', 'site.name', 'portal.phone', 'portal.code', 'portal.reason']);
function renderKeepFocus() {
  const a = document.activeElement;
  const key = a && a.dataset && a.dataset.f ? { f: a.dataset.f, i: a.dataset.i, id: a.dataset.id } : null;
  let pos = null; try { pos = a.selectionStart; } catch (e) { }
  render();
  if (key) {
    const sel = `[data-f="${key.f}"]` + (key.i != null ? `[data-i="${key.i}"]` : '') + (key.id != null ? `[data-id="${key.id}"]` : '');
    const n = document.querySelector(sel);
    if (n) { n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch (e) { } }
  }
}
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  setField(el);
  if (!QUIET.has(el.dataset.f)) renderKeepFocus();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.a === 'role') { setRole(el.value); UI.side = null; window.scrollTo(0, 0); return render(); }
  if (el.dataset && el.dataset.a === 'ppref') return act('ppref', el.dataset, el);
  if (el.dataset && el.dataset.f && el.tagName === 'SELECT') { setField(el); return renderKeepFocus(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (UI.demoMenu && !e.target.closest('.top')) { UI.demoMenu = false; render(); } return; }
  if (el.tagName === 'SELECT') return;
  if (el.disabled) return;
  act(el.dataset.a, el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  const k = e.target && e.target.closest && e.target.closest('[data-a][tabindex]');
  if (k && k === e.target && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); k.click(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (UI.tv) UI.tv = false; else if (UI.modal) UI.modal = null; else if (UI.demoMenu) UI.demoMenu = false; render(); } });

/* ---------- start ---------- */
UI.cu = {}; UI.drafts = { recipe: {}, price: {} }; UI.commOpen = {};
if (!load()) { seed(); save(); }
I18N.onchange = () => render();
I18N.start();
render();

</script></body></html>
